services:
  backend:
    build:
      context: ./backend/multi-audio-guide
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audio_guide
      SPRING_DATASOURCE_USERNAME: audio_guide
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Chua dat POSTGRES_PASSWORD}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-demo}
      TRANSLATION_URL: ${TRANSLATION_URL:-http://host.docker.internal:5000/translate}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
      DEMO_EDITOR_PASSWORD: ${DEMO_EDITOR_PASSWORD:-EditorDemo!2026}
      DEMO_REVIEWER_PASSWORD: ${DEMO_REVIEWER_PASSWORD:-ReviewerDemo!2026}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS: always
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  web-admin:
    build:
      context: ./web-admin
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  web-user:
    profiles: ["tourist-web"]
    build:
      context: ./web-user
    ports:
      - "127.0.0.1:${TOURIST_WEB_PORT:-4176}:4176"
    environment:
      API_PROXY_TARGET: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgis/postgis:17-3.6-alpine
    environment:
      POSTGRES_DB: audio_guide
      POSTGRES_USER: audio_guide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chua dat POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audio_guide -d audio_guide"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  postgres_data:
