# Optional local demo: reuse the running hvp-live-demo backend from the port-3000 UI.
# Avoids migrating a legacy database created on another branch.
services:
  backend:
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hvp-live-demo-postgres-1:5432/audio_guide
    networks:
      - default
      - live-demo
  web-admin:
    networks:
      - default
      - live-demo
    volumes:
      - ./scripts/nginx-admin-shared.conf:/etc/nginx/conf.d/default.conf:ro
networks:
  live-demo:
    external: true
    name: hvp-live-demo_default
