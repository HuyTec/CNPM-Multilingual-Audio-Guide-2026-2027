
# Flyway migrations
spring.flyway.locations=classpath:db/migration,classpath:db/demo
spring.flyway.out-of-order=true

# Demo admin
demo.admin.username=${DEMO_ADMIN_USERNAME:admin}
demo.admin.password=${DEMO_ADMIN_PASSWORD:1234@abcd}

# Multipart
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Translation
translation.provider=${TRANSLATION_PROVIDER:demo}
translation.url=${TRANSLATION_URL:http://localhost:5000/translate}
translation.api-key=${TRANSLATION_API_KEY:}

# Demo seed
demo.seed.editor-password=${DEMO_EDITOR_PASSWORD}
demo.seed.reviewer-password=${DEMO_REVIEWER_PASSWORD}
