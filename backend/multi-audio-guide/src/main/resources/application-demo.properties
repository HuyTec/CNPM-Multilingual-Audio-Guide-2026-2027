spring.flyway.locations=classpath:db/migration,classpath:db/demo
spring.flyway.out-of-order=true
demo.admin.username=${DEMO_ADMIN_USERNAME:admin}
demo.admin.password=${DEMO_ADMIN_PASSWORD:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

translation.provider=${TRANSLATION_PROVIDER:demo}
translation.url=${TRANSLATION_URL:http://localhost:5000/translate}
translation.api-key=${TRANSLATION_API_KEY:}
demo.seed.editor-password=${DEMO_EDITOR_PASSWORD:EditorDemo!2026}
demo.seed.reviewer-password=${DEMO_REVIEWER_PASSWORD:ReviewerDemo!2026}
